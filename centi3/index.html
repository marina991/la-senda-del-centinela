<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Senda del Centinela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#16212b;--panel:#1f2e3a;--ink:#e9e4d4;--mut:#9fb0b8;--gold:#e0a64a;--moss:#7fa37a;--ember:#d1634a;--line:#33485a;--tbg:#0c1319;--tink:#b9dcaa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark light}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e6ebe4;--panel:#f6f8f3;--ink:#1b2a33;--mut:#51636c;--gold:#9a6512;--moss:#3f6f45;--ember:#b23f27;--line:#c3cdc2}}
:root[data-theme="dark"]{--bg:#16212b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Alegreya Sans",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 14px 48px}
h1,h2,h3{font-family:Cinzel,Georgia,serif;margin:0}
h1{font-size:26px;font-weight:800;letter-spacing:.02em}
h2{font-size:21px}
h3{font-size:16px;color:var(--gold)}
.sub{color:var(--mut);margin:2px 0 12px}
.hud{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .5s}
.rank{font-family:Cinzel,serif;font-weight:600;font-size:14px;white-space:nowrap}
.warn{border:1px solid var(--ember);border-radius:8px;padding:8px 12px;font-size:15px;margin:10px 0}
svg.map{width:100%;height:auto;display:block;margin:6px 0}
.map path{fill:none;stroke:var(--line);stroke-width:5;stroke-dasharray:2 9;stroke-linecap:round}
.map g{cursor:pointer}
.map circle{stroke-width:3}
.map text{font:700 15px Cinzel,serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.panel{background:var(--panel);border-radius:10px;border-left:6px solid var(--c,var(--gold));padding:14px 16px;margin-top:10px}
.panel p{margin:8px 0}
.les{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.les li{margin:6px 0}
.ch{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.ch.ok{opacity:.75}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;font:inherit;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--gold);outline:none}
.opt.good{border-color:var(--moss);background:color-mix(in srgb,var(--moss) 22%,transparent)}
.opt.bad{border-color:var(--ember)}
.fb{margin:6px 0;font-size:16px}.fb.g{color:var(--moss)}.fb.b{color:var(--ember)}
.term{background:var(--tbg);color:var(--tink);border-radius:8px;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:10px;margin-top:8px}
.log{max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .p{display:flex;gap:6px;margin-top:6px}
.term input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;outline:none;caret-color:var(--gold)}
button.go{background:var(--gold);color:#1b1608;border:0;border-radius:8px;padding:9px 16px;font:700 16px "Alegreya Sans",sans-serif;cursor:pointer;margin-top:10px}
.lock{color:var(--mut)}
.cover{position:relative;aspect-ratio:4/3;max-height:75vh;border-radius:10px;overflow:hidden;margin:4px 0 10px;box-shadow:0 0 30px -6px #7a6bd0}
.cover .hero{position:absolute;inset:0;width:100%;height:100%;margin:0;box-shadow:none;border-radius:0}
.cover::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 55%,rgba(6,9,20,.75))}
.sl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s;animation:kb 14s ease-in-out infinite alternate}
.sl.on{opacity:1}
@keyframes kb{to{transform:scale(1.12)}}

img.emb{width:96px;height:96px;object-fit:cover;border-radius:12px;float:right;margin:0 0 8px 12px;box-shadow:0 0 18px rgba(224,166,74,.5)}
html{background:#060914}
body{background:transparent}
#bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(60% 50% at 20% 15%,rgba(120,70,220,.45),transparent 70%),radial-gradient(55% 45% at 85% 25%,rgba(30,150,170,.35),transparent 70%),radial-gradient(70% 55% at 50% 100%,rgba(210,120,50,.28),transparent 70%),#070b1a;animation:neb 40s ease-in-out infinite alternate}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}
@keyframes neb{to{filter:hue-rotate(45deg) saturate(1.3);transform:scale(1.25) rotate(3deg)}}
h1{background:linear-gradient(90deg,#e9e4d4,#e0a64a,#a98bff,#7fe3ff,#e9e4d4);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite;filter:drop-shadow(0 0 10px rgba(224,166,74,.45))}
@keyframes shine{to{background-position:300% 0}}
.bar i{background:linear-gradient(90deg,#e0a64a,#fff0b8,#e0a64a);background-size:200% 100%;animation:shine 2s linear infinite;box-shadow:0 0 12px #e0a64a}
.panel{background:rgba(18,26,48,.78);backdrop-filter:blur(8px);box-shadow:0 0 32px -8px var(--c,#e0a64a)}
.panel.in{animation:rise .7s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
.warn{background:rgba(209,99,74,.1);animation:warnp 3s ease-in-out infinite}
@keyframes warnp{50%{box-shadow:0 0 14px rgba(209,99,74,.45)}}
.map path{animation:flow 1.6s linear infinite;stroke:#7a6bd0}
@keyframes flow{to{stroke-dashoffset:-22}}
.map g.o circle{animation:pulse 1.8s ease-in-out infinite;filter:drop-shadow(0 0 7px #e0a64a)}
.map g.d circle{filter:drop-shadow(0 0 6px #7fa37a)}
.map g:hover circle{filter:drop-shadow(0 0 12px #fff)}
@keyframes pulse{50%{stroke-width:6;opacity:.65}}
.hero{box-shadow:0 0 30px -6px #7a6bd0}
.hero g circle{animation:tw 2.4s ease-in-out infinite}
.hero g circle:nth-child(2n){animation-delay:.9s}
.hero rect[fill="#e0a64a"]{animation:flick 1.4s infinite}
.hero circle[r="16"]{filter:drop-shadow(0 0 8px #e9e4d4);animation:moon 5s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
@keyframes flick{40%{opacity:.4}60%{opacity:1}80%{opacity:.6}}
@keyframes moon{50%{filter:drop-shadow(0 0 16px #fff)}}
.emb{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 8px #fff);transform:rotate(4deg) scale(1.08)}}
.opt{transition:transform .2s,box-shadow .2s,border-color .2s}
.opt:hover{box-shadow:0 0 14px rgba(224,166,74,.5);transform:translateX(4px)}
.opt.good{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.04);box-shadow:0 0 24px #7fa37a}}
.term{position:relative;box-shadow:0 0 20px rgba(120,220,170,.18);border:1px solid #1d3a34}
.term::after{content:"";position:absolute;inset:0;border-radius:8px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.term .p span{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chip:hover{box-shadow:0 0 10px rgba(185,220,170,.5)}
button.go{animation:warnp 2s infinite}
#view.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
#snd{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:8;background:rgba(10,14,30,.8);color:var(--ink);border:1px solid #7a6bd0;border-radius:18px;padding:6px 12px;font:600 14px "Alegreya Sans",sans-serif;cursor:pointer;backdrop-filter:blur(6px);animation:warnp 2.4s infinite}
#snd[aria-pressed="true"]{border-color:var(--gold);animation:none;box-shadow:0 0 14px rgba(224,166,74,.6)}
.toast{position:fixed;left:50%;top:22%;z-index:9;text-align:center;padding:14px 24px;border-radius:12px;background:rgba(10,14,30,.9);border:1px solid var(--gold);box-shadow:0 0 44px rgba(224,166,74,.55);font:700 22px Cinzel,serif;color:#fff0b8;animation:toast 2.6s ease forwards;pointer-events:none}
.toast span{display:block;font:500 16px "Alegreya Sans",sans-serif;color:var(--ink);margin-top:2px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,24px) scale(.7)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{width:100%;height:auto;border-radius:10px;display:block;margin:4px 0 10px}
.emb{width:46px;height:46px;float:right;margin:0 0 6px 10px}
.plan{background:color-mix(in srgb,var(--gold) 12%,transparent);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:16px}
.plan ol{margin:4px 0 0;padding-left:20px}
.chips,.tb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:transparent;color:var(--tink);border:1px solid #355060;border-radius:14px;padding:5px 10px;font:13px ui-monospace,Menlo,monospace;cursor:pointer}
.tb .chip{color:var(--gold);border-color:var(--gold);font-family:"Alegreya Sans",sans-serif;font-size:15px}
.run{background:var(--gold);color:#1b1608;border:0;border-radius:6px;padding:6px 12px;font:700 14px "Alegreya Sans",sans-serif;cursor:pointer}
form.p{align-items:center}
.end{text-align:center;padding:18px 16px}
.end h2{color:var(--gold);font-size:24px;margin-bottom:6px}
.small{font-size:14px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="bg"></div><canvas id="fx" aria-hidden="true"></canvas>
<button id="snd" type="button" aria-pressed="false">♪ Sonido apagado</button>
<main>
<h1>La Senda del Centinela</h1>
<p class="sub">Cruza seis reinos y aprende hacking ético. Todo ocurre en un laboratorio simulado.</p>
<div class="cover"><svg class="hero" preserveAspectRatio="xMidYMid slice" viewBox="0 0 360 120" role="img" aria-label="Un centinela ante una torre bajo la luna"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1a24"/><stop offset="1" stop-color="#34506a"/></linearGradient></defs><rect width="360" height="120" fill="url(#sk)"/><circle cx="290" cy="30" r="16" fill="#e9e4d4"/><circle cx="297" cy="26" r="14" fill="#1a2b3a" opacity=".35"/><path d="M0 90L50 50l40 32 50-46 60 56 60-40 50 38 50-30v60H0z" fill="#22394d"/><path d="M0 105l70-26 60 22 70-30 70 28 90-20v41H0z" fill="#162531"/><path d="M180 100V48l10-14 10 14v52z" fill="#0c141b"/><rect x="187" y="56" width="6" height="9" fill="#e0a64a"/><path d="M62 100v-14l5-8 5 8v14z" fill="#0c141b"/><circle cx="67" cy="72" r="4" fill="#0c141b"/><path d="M65 74l-6 6 14 0z" fill="#0c141b"/><g fill="#e9e4d4" opacity=".8"><circle cx="40" cy="20" r="1.2"/><circle cx="120" cy="14" r="1.2"/><circle cx="210" cy="22" r="1.2"/><circle cx="250" cy="10" r="1.2"/></g></svg><div id="slides"></div></div>
<div class="hud"><div class="bar"><i id="xpb"></i></div><div class="rank" id="rk"></div></div>
<div class="warn">Regla del Centinela: solo se ataca lo que está en el mapa autorizado, con permiso por escrito. Fuera de eso, es delito.</div>
<svg class="map" id="map" viewBox="0 0 360 140" role="img" aria-label="Mapa de los seis reinos"></svg>
<div id="view"></div>
<p class="small"><a href="#" id="rst" style="color:var(--mut)">Reiniciar progreso</a></p>
</main>
<script>
const R=[
{n:"El Valle Verde",s:"Fundamentos y ética",c:"#7fa37a",
story:"Tu aventura empieza en la aldea. El anciano te entrega la Llave de Hierro: el dato que todos quieren robar. Antes de salir, debes jurar el código del Centinela.",
lesson:["El hacking ético es probar la seguridad de un sistema con autorización escrita, un alcance definido y el compromiso de reportar lo que encuentres.","La tríada CIA resume qué protegemos: Confidencialidad (solo quien debe, ve), Integridad (nadie lo altera sin permiso) y Disponibilidad (sigue funcionando).","Fases típicas: reconocimiento, escaneo, explotación, post-explotación y reporte."],
ch:[
{t:"q",q:"¿Qué distingue a un hacker ético de un atacante?",o:["Usa herramientas distintas","Tiene autorización escrita y alcance definido","Trabaja solo de noche","Nunca encuentra fallos graves"],a:1,why:"Las técnicas pueden ser las mismas. Lo que cambia es el permiso, el alcance y el objetivo."},
{t:"q",q:"Un ransomware cifra todos los archivos de una empresa. ¿Qué pilar de la tríada CIA afecta de forma directa?",o:["Disponibilidad","Autenticación","Trazabilidad","Cifrado"],a:0,why:"Sin acceso a sus datos, la empresa pierde disponibilidad."},
{t:"t",q:"Misión: lee el contrato de alcance de la misión y entrega la bandera que contiene.",help:"Comandos: ayuda, ls, cat <archivo>, whoami, entregar <bandera>",flag:"FLAG{alcance_firmado}",cmds:[[/^ls$/,"alcance.txt  notas.txt"],[/^whoami$/,"centinela"],[/^cat notas\.txt$/,"Recuerda: nada fuera del alcance. Si dudas, pregunta al cliente."],[/^cat alcance\.txt$/,"CONTRATO DE ALCANCE\nObjetivo permitido: 10.0.0.0/24 (laboratorio)\nProhibido: cualquier otra red\nFirmado por: El Anciano\nBandera: FLAG{alcance_firmado}"]]}]},
{n:"El Bosque Alto",s:"Reconocimiento (OSINT)",c:"#5f9f8c",
story:"Los elfos del bosque ven sin ser vistos. Desde las ramas debes aprender todo sobre el Reino Sombra sin tocar sus murallas.",
lesson:["Reconocimiento pasivo: reunir información sin interactuar con el objetivo (whois, DNS público, buscadores, redes sociales, metadatos).","Reconocimiento activo: interactuar con el objetivo, por ejemplo escaneando sus puertos. Deja huellas en sus registros.","Los dorks de buscador y los metadatos de documentos públicos revelan nombres de usuario, versiones de software y rutas internas."],
ch:[
{t:"q",q:"¿Cuál de estas acciones es reconocimiento pasivo?",o:["Escanear todos los puertos del servidor","Probar contraseñas en el login","Consultar el registro whois del dominio","Enviar un correo falso a un empleado"],a:2,why:"Whois es información pública y no toca los sistemas del objetivo."},
{t:"q",q:"Un PDF público de la empresa incluye autor, versión de Word y la ruta C:\\Usuarios\\jperez\\. ¿Cómo se llama esa información oculta?",o:["Metadatos","Cookies","Payload","Banner"],a:0,why:"Los metadatos filtran usuarios y software. Conviene limpiarlos antes de publicar."},
{t:"t",q:"Misión: investiga el dominio reino-sombra.test. Algún registro DNS guarda una bandera.",help:"Comandos: ayuda, whois <dominio>, dig <dominio> <tipo>, entregar <bandera>",flag:"FLAG{ojo_del_bosque}",cmds:[[/^whois reino-sombra\.test$/,"Dominio: reino-sombra.test\nTitular: Gremio de Sombra\nContacto: admin@reino-sombra.test\nCreado: 1999-03-14"],[/^dig reino-sombra\.test a$/,"reino-sombra.test. IN A 10.0.0.5"],[/^dig reino-sombra\.test mx$/,"reino-sombra.test. IN MX mail.reino-sombra.test."],[/^dig reino-sombra\.test txt$/,"reino-sombra.test. IN TXT \"v=spf1 -all\"\nreino-sombra.test. IN TXT \"nota-interna: FLAG{ojo_del_bosque}\""]]}]},
{n:"Las Cavernas de Khazrum",s:"Escaneo y enumeración",c:"#c28a45",
story:"En la oscuridad de las minas cada puerta es un puerto. Con tu farol debes descubrir cuáles están abiertas y qué guarda cada una.",
lesson:["Un puerto abierto es un servicio escuchando. Cada servicio es una posible puerta de entrada.","Nmap descubre puertos abiertos. Con -sV intenta identificar el servicio y su versión.","Enumerar es extraer detalle: banners, versiones, usuarios y recursos compartidos. Una versión antigua apunta a vulnerabilidades conocidas (CVE)."],
ch:[
{t:"q",q:"¿Qué hace la opción -sV de nmap?",o:["Escanea más rápido","Detecta la versión de los servicios","Oculta tu IP","Explota las vulnerabilidades"],a:1,why:"-sV prueba cada puerto abierto para identificar servicio y versión."},
{t:"q",q:"El escaneo muestra 21/tcp open ftp vsftpd 2.3.4. ¿Cuál es el paso más sensato?",o:["Borrar los logs","Buscar CVE de esa versión y verificar si es vulnerable, dentro del alcance","Ignorarlo porque FTP es viejo","Apagar el servidor remoto"],a:1,why:"Una versión concreta se contrasta con bases de CVE para confirmar el riesgo real."},
{t:"t",q:"Misión: escanea 10.0.0.5, identifica los servicios y conéctate al que tenga un banner delator.",help:"Comandos: ayuda, nmap <ip>, nmap -sV <ip>, nc <ip> <puerto>, entregar <bandera>",flag:"FLAG{luz_en_la_mina}",cmds:[[/^nmap 10\.0\.0\.5$/,"21/tcp open  ftp\n22/tcp open  ssh\n80/tcp open  http"],[/^nmap -sV 10\.0\.0\.5$/,"21/tcp open  ftp   vsftpd 2.3.4\n22/tcp open  ssh   OpenSSH 4.7\n80/tcp open  http  Apache 2.2.8"],[/^nc 10\.0\.0\.5 21$/,"220 (vsFTPd 2.3.4) Bienvenido, minero. FLAG{luz_en_la_mina}"],[/^nc 10\.0\.0\.5 22$/,"SSH-2.0-OpenSSH_4.7"],[/^nc 10\.0\.0\.5 80$/,"Conexión abierta. Envía una petición HTTP."],[/^nmap /,"Fuera de alcance o dirección inválida. Tu mapa autorizado es 10.0.0.5."]]}]},
{n:"La Torre de Ortrak",s:"Vulnerabilidades web",c:"#b8563f",
story:"El mago de la torre guarda sus secretos tras un buscador mágico. Sus conjuros están mal escritos: fíjate cómo responde cuando le hablas con palabras extrañas.",
lesson:["OWASP Top 10 es la lista de los riesgos web más comunes: control de acceso roto, inyección, configuración insegura y más.","SQL injection: la entrada del usuario se mezcla con la consulta y cambia su significado. La defensa son las consultas parametrizadas.","XSS inyecta scripts en páginas que otros ven. IDOR cambia un identificador en la URL y accede a datos ajenos."],
ch:[
{t:"q",q:"Escribes ' OR '1'='1 en un login y entras sin contraseña. ¿Qué vulnerabilidad es?",o:["XSS","SQL injection","CSRF","Fuerza bruta"],a:1,why:"La entrada altera la lógica de la consulta SQL. Se corrige con consultas parametrizadas."},
{t:"q",q:"Estás en /perfil?id=7. Al cambiar a id=8 ves los datos de otra persona. ¿Qué fallo es?",o:["Inyección de comandos","Cabecera mal configurada","IDOR (control de acceso roto)","Desbordamiento de búfer"],a:2,why:"El servidor no comprueba que ese recurso pertenezca a quien lo pide."},
{t:"t",q:"Misión: prueba el buscador de torre.test. Comprueba cómo reacciona y consigue volcar la tabla de usuarios.",help:"Comandos: ayuda, curl <url>, entregar <bandera>\nEjemplo: curl torre.test/buscar?q=anillo",flag:"FLAG{conjuro_roto}",cmds:[[/^curl torre\.test\/buscar\?q=anillo$/,"Resultados: 1 libro, \"Historia del Anillo\""],[/^curl torre\.test\/buscar\?q='$/,"ERROR 500: You have an error in your SQL syntax near '''\nEl buscador es sensible a las comillas."],[/^curl torre\.test\/buscar\?q=.*or\s*('?1'?\s*=\s*'?1)/i,"Resultados: todas las filas\nusuarios: mago_ortrak | aprendiz | FLAG{conjuro_roto}"],[/^curl /,"Respuesta 200. Nada interesante. Prueba con torre.test/buscar?q=..."]]}]},
{n:"La Ciudadela Blanca",s:"Defensa (Blue Team)",c:"#9fb8d9",
story:"Ahora cambias de bando: defiendes la capital. Las antorchas son los logs y las murallas, tus controles. Un atacante golpea la puerta.",
lesson:["Defensa en profundidad: varias capas (firewall, parches, mínimo privilegio, MFA, monitoreo). Si una falla, otra contiene.","Las contraseñas se guardan con hash lento y sal (bcrypt, Argon2). Nunca en texto plano ni con MD5.","Los logs cuentan la historia. Muchos fallos de login desde una IP indican fuerza bruta. Respuesta: limitar intentos, bloquear y alertar."],
ch:[
{t:"q",q:"¿Cuál es la forma correcta de guardar contraseñas?",o:["En texto plano cifrado con una clave fija","Con MD5","Con un hash lento con sal (Argon2 o bcrypt)","En una cookie"],a:2,why:"El hash lento con sal frena los ataques de diccionario y tablas precalculadas."},
{t:"q",q:"Los logs muestran 500 logins fallidos desde una misma IP en un minuto. ¿Qué controles ayudan más?",o:["Limitar intentos y activar MFA","Quitar los logs","Hacer la web más bonita","Subir el límite de intentos"],a:0,why:"El rate limiting corta la fuerza bruta y MFA protege aunque la clave se adivine."},

 cx.globalCompositeOperation="source-over";requestAnimationFrame(frame)}
